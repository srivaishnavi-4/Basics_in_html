<html>

        <script src="scipt.js" type="text/javascript"></script>
    </head>

        <h1>internal Javascript by using inner html</h1>
        <p id="demo"></p>

            <script>

            <p id="samp" onclick="hello()">click me</p>

        </body>
    </head>
