<!DOCTYPE html>
<html>
    <head>
        <title>Welcome</title>
    </head>
    <body>
        <p>Image tag</p>
        <p>with relative url</p>
        <img src="https://static.wixstatic.com/media/2b9330_dd668a2e1d664129a64eba0689ffd142~mv2_d_1920_1386_s_2.jpg/v1/fill/w_560,h_374,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/africa-animal-big-cat-88234.jpg"
       alt="dog image" height="300px" width="400px"><!--image tag with src of relative url,alt,height,width attributes-->
       <p>with absolute url</p>
       <img src="flower.jpg"
       alt="flower image" height="300px" width="400px"><!--image tag with src of absolute url,alt,height,width attributes-->
       <p> gif can also be added by using float</p>
       <img src="/gif_image.gif"
       alt="mushroom image" style="float:right;width:400px;height:300px;"><!--image tag with src of another folder,alt,height,width attributes-->
    </body>
</html>
